<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  style="padding: 8px 12px"
>
  <hbox align="center" style="margin-bottom: 8px">
    <html:img
      src="chrome://__addonRef__/content/icons/favicon.svg"
      width="48"
      height="48"
      style="margin-right: 12px"
    />
    <vbox>
      <label>
        <html:h1
          data-l10n-id="pref-title"
          style="margin: 0; font-size: 1.3em"
        ></html:h1>
      </label>
      <html:label
        data-l10n-id="pref-subtitle"
        style="opacity: 0.72; font-size: 0.92em; margin-top: 2px"
      ></html:label>
    </vbox>
  </hbox>

  <groupbox>
    <label>
      <html:h2
        data-l10n-id="pref-section-general"
        style="margin: 0 0 6px 0"
      ></html:h2>
    </label>
    <checkbox
      id="zotero-prefpane-__addonRef__-enable"
      preference="enable"
      data-l10n-id="pref-enable"
    />
  </groupbox>

  <groupbox>
    <label>
      <html:h2
        data-l10n-id="pref-section-language"
        style="margin: 0 0 6px 0"
      ></html:h2>
    </label>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-source-language"
        data-l10n-id="pref-source-language"
        style="min-width: 160px"
      ></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-source-language"
        preference="sourceLanguage"
        style="min-width: 220px"
      >
        <menupopup>
          <menuitem value="auto" data-l10n-id="pref-language-auto" />
          <menuitem value="zh-CN" data-l10n-id="pref-language-zh-cn" />
          <menuitem value="en" data-l10n-id="pref-language-en" />
          <menuitem value="ja" data-l10n-id="pref-language-ja" />
          <menuitem value="ko" data-l10n-id="pref-language-ko" />
          <menuitem value="fr" data-l10n-id="pref-language-fr" />
          <menuitem value="de" data-l10n-id="pref-language-de" />
          <menuitem value="es" data-l10n-id="pref-language-es" />
          <menuitem value="ru" data-l10n-id="pref-language-ru" />
          <menuitem value="pt-BR" data-l10n-id="pref-language-pt-br" />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-target-language"
        data-l10n-id="pref-target-language"
        style="min-width: 160px"
      ></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-target-language"
        preference="targetLanguage"
        style="min-width: 220px"
      >
        <menupopup>
          <menuitem value="auto" data-l10n-id="pref-language-auto" />
          <menuitem value="zh-CN" data-l10n-id="pref-language-zh-cn" />
          <menuitem value="en" data-l10n-id="pref-language-en" />
          <menuitem value="ja" data-l10n-id="pref-language-ja" />
          <menuitem value="ko" data-l10n-id="pref-language-ko" />
          <menuitem value="fr" data-l10n-id="pref-language-fr" />
          <menuitem value="de" data-l10n-id="pref-language-de" />
          <menuitem value="es" data-l10n-id="pref-language-es" />
          <menuitem value="ru" data-l10n-id="pref-language-ru" />
          <menuitem value="pt-BR" data-l10n-id="pref-language-pt-br" />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox>
    <label>
      <html:h2
        data-l10n-id="pref-section-ocr"
        style="margin: 0 0 6px 0"
      ></html:h2>
    </label>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-mistral-key"
        data-l10n-id="pref-mistral-key"
        style="min-width: 160px"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-mistral-key"
        preference="mistralApiKey"
        placeholder="sk-..."
        style="flex: 1; min-width: 320px"
      ></html:input>
    </hbox>
    <checkbox
      id="zotero-prefpane-__addonRef__-inline-images"
      preference="inlineImages"
      data-l10n-id="pref-inline-images"
      style="margin-top: 6px"
    />
  </groupbox>

  <groupbox>
    <label>
      <html:h2
        data-l10n-id="pref-section-llm"
        style="margin: 0 0 6px 0"
      ></html:h2>
    </label>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        data-l10n-id="pref-llm-profile"
        style="min-width: 160px; font-weight: 600"
      ></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-llm-profile-select"
        style="min-width: 200px"
      >
        <menupopup id="zotero-prefpane-__addonRef__-llm-profile-popup">
          <menuitem value="" data-l10n-id="pref-llm-profile-none" />
        </menupopup>
      </menulist>
      <html:button
        id="zotero-prefpane-__addonRef__-llm-profile-save"
        data-l10n-id="pref-llm-profile-save"
        style="margin-left: 6px"
      ></html:button>
      <html:button
        id="zotero-prefpane-__addonRef__-llm-profile-delete"
        data-l10n-id="pref-llm-profile-delete"
        style="margin-left: 4px"
      ></html:button>
    </hbox>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-llm-api-key"
        data-l10n-id="pref-llm-api-key"
        style="min-width: 160px"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-llm-api-key"
        preference="llmApiKey"
        placeholder="sk-..."
        style="flex: 1; min-width: 320px"
      ></html:input>
    </hbox>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-llm-api-url"
        data-l10n-id="pref-llm-api-url"
        style="min-width: 160px"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-llm-api-url"
        preference="llmApiUrl"
        placeholder="https://api.openai.com/v1"
        style="flex: 1; min-width: 320px"
      ></html:input>
    </hbox>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-llm-model"
        data-l10n-id="pref-llm-model"
        style="min-width: 160px"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-llm-model"
        preference="llmModel"
        placeholder="gpt-5-mini"
        style="flex: 1; min-width: 320px"
      ></html:input>
    </hbox>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-translation-chunk-chars"
        data-l10n-id="pref-translation-chunk-chars"
        style="min-width: 160px"
      ></html:label>
      <html:input
        type="number"
        id="zotero-prefpane-__addonRef__-translation-chunk-chars"
        preference="translationChunkChars"
        min="2000"
        max="50000"
        step="1000"
        placeholder="12000"
        style="flex: 1; min-width: 320px"
      ></html:input>
    </hbox>
    <html:label
      data-l10n-id="pref-translation-chunk-chars-help"
      style="
        opacity: 0.72;
        font-size: 0.88em;
        margin-top: 4px;
        line-height: 1.45;
      "
    ></html:label>
    <checkbox
      id="zotero-prefpane-__addonRef__-skip-reference-translation"
      preference="skipReferenceTranslation"
      data-l10n-id="pref-skip-reference-translation"
      style="margin-top: 6px"
    />
    <html:label
      data-l10n-id="pref-llm-api-help"
      style="
        opacity: 0.72;
        font-size: 0.88em;
        margin-top: 4px;
        line-height: 1.45;
      "
    ></html:label>
    <checkbox
      id="zotero-prefpane-__addonRef__-review-generated-html"
      preference="reviewGeneratedHtml"
      data-l10n-id="pref-review-generated-html"
      style="margin-top: 6px"
    />
  </groupbox>

  <groupbox>
    <label>
      <html:h2
        data-l10n-id="pref-section-advanced"
        style="margin: 0 0 6px 0"
      ></html:h2>
    </label>
    <hbox align="center" style="margin: 4px 0">
      <html:label
        for="zotero-prefpane-__addonRef__-python-path"
        data-l10n-id="pref-python-path"
        style="min-width: 160px"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-python-path"
        preference="pythonPath"
        placeholder="python3"
        style="flex: 1; min-width: 320px"
      ></html:input>
    </hbox>
    <html:label
      data-l10n-id="pref-python-path-help"
      style="
        opacity: 0.72;
        font-size: 0.88em;
        margin-top: 4px;
        line-height: 1.45;
      "
    ></html:label>
  </groupbox>

  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    style="
      opacity: 0.55;
      font-size: 0.82em;
      margin-top: 8px;
      text-align: center;
    "
  ></html:label>
</vbox>
